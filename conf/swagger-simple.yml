# Swagger minimal runtime example
lynx:
  swagger:
    enabled: true
    generator:
      enabled: true
      scan_dirs:
        - "./app"
      output_path: "./docs/openapi.yaml"
      watch_files: true
      file_watcher:
        enabled: true
        interval: 1s
        debounce_delay: 500ms
        max_retries: 3
        retry_delay: 1s
        batch_size: 10
        health_check: true
    ui:
      enabled: true
      port: 8081
      path: "/swagger"
      deepLinking: true
      docExpansion: "list"
    info:
      title: "My API"
      version: "1.0.0"
      description: "Runtime API documentation"
    api_server:
      host: "localhost:8080"
      base_path: ""
