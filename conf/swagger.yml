# Swagger full runtime example
lynx:
  swagger:
    enabled: true

    security:
      environment: "development"
      allowed_environments:
        - "development"
        - "testing"
      disable_in_production: true
      trusted_origins:
        - "http://localhost:8080"
        - "http://localhost:8081"
        - "http://127.0.0.1:8080"
        - "http://127.0.0.1:8081"

    generator:
      enabled: true
      scan_dirs:
        - "./app/controllers"
        - "./app/handlers"
      spec_files:
        - "./docs/openapi.base.yaml"
      output_path: "./docs/openapi.yaml"
      watch_files: true
      file_watcher:
        enabled: true
        interval: 1s
        debounce_delay: 500ms
        max_retries: 3
        retry_delay: 1s
        batch_size: 10
        health_check: true

    ui:
      enabled: true
      port: 8081
      path: "/swagger"
      deepLinking: true
      docExpansion: "list"

    info:
      title: "Lynx Microservice API"
      description: "API documentation built from OpenAPI files and Go annotations"
      version: "1.0.0"
      termsOfService: "https://swagger.io/terms/"
      contact:
        name: "API Support Team"
        email: "api-support@example.com"
        url: "https://example.com/support"
      license:
        name: "Apache 2.0"
        url: "https://www.apache.org/licenses/LICENSE-2.0"

    api_server:
      host: "localhost:8080"
      base_path: "/api/v1"
